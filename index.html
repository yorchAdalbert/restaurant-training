<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Restaurant Training</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="container">
      <article class="dish-training">
        <section class="dish-hero">
          <div class="dish-image">
            <img
              src="images/dishes/tuna-spicy-toast.png"
              alt="Tuna Spicy Toast"
            />
          </div>

          <div class="dish-info">
            <p class="eyebrow">APPETIZER</p>

            <h2>TUNA SPICY TOAST</h2>

            <p class="dish-description">
              Crispy toast topped with fresh tuna, chipotle mayo, avocado and
              house ingredients.
            </p>
          </div>
        </section>

        <section class="training-section">
          <h3>Ingridents</h3>

          <div id="ingredients-list" class="ingredients-grid"></div>
          
          <div id="ingredient-details" class="ingredient-details">
            <p>Select an ingredient to learn more about it.</p>
          </div>
        </section>

        <section class="training-section">
          <h3>Allergens</h3>
          <div id="allergens-list" class="allergens-list"></div>
        </section>

        <section class="training-section">
          <h3>Preparation</h3>

          <ol id="preparation-list" class="preparation-list"></ol>
        </section>

        <section class="training-section">
          <h3>Selling Points</h3>

        <ul id="selling-points-list" class="selling-points-list"></ul>
        </section>
      </article>
    </main>

    <script src="js/menu-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
